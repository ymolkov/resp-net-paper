<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Resp-net | Circuit atlas</title>
    <link rel="icon" href="data:," />
    <style>
      <!--STYLE-->
    </style>
  </head>
  <body>
    <header>
      <div class="brand">resp-net <span>Circuit atlas</span></div>
      <div class="header-tools">
        <button id="guide-open" class="guide-open" title="Step-by-step guide">
          Guide
        </button>
        <button
          class="icon"
          id="about"
          data-icon="info"
          title="About this atlas"
          aria-label="About this atlas"
        ></button>
      </div>
    </header>
    <main id="workspace">
      <svg
        id="atlas"
        role="group"
        aria-label="Expandable respiratory circuit"
        tabindex="0"
      >
        <defs>
          <marker
            id="arrowE"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="9"
            markerHeight="9"
            markerUnits="userSpaceOnUse"
            orient="auto"
          >
            <path d="M0 0L10 5L0 10Z" fill="#b83e3d" />
          </marker>
        </defs>
        <g id="world">
          <g id="family-layer"></g>
          <g id="edges"></g>
          <g id="nodes"></g>
          <g id="evidence-layer"></g>
          <g id="cells-layer"></g>
        </g>
      </svg>
      <nav class="breadcrumbs" aria-label="Graph context">
        <button
          id="back"
          class="icon"
          data-icon="arrow-left"
          title="Back one expansion"
          aria-label="Back one expansion"
          disabled
        ></button>
        <button id="home">Whole circuit</button><span id="context"></span>
      </nav>
      <div class="zoom-tools" role="group" aria-label="Graph navigation">
        <button
          class="icon"
          id="zoom-in"
          data-icon="zoom-in"
          title="Zoom in"
          aria-label="Zoom in"
        ></button>
        <button
          class="icon"
          id="zoom-out"
          data-icon="zoom-out"
          title="Zoom out"
          aria-label="Zoom out"
        ></button>
        <span class="tool-divider"></span>
        <button
          id="fit"
          class="fit-text"
          title="Fit everything in view"
          aria-label="Fit everything in view"
        >
          Fit
        </button>
        <button
          class="icon"
          id="fullscreen"
          data-icon="maximize"
          title="Full screen"
          aria-label="Full screen"
        ></button>
      </div>
      <div id="tip" role="tooltip" hidden></div>
      <aside id="guide" class="guide" aria-label="Guide" aria-live="polite" hidden>
        <div class="guide-text">
          <div id="guide-step" class="guide-step"></div>
          <h2 id="guide-title"></h2>
          <p id="guide-body"></p>
        </div>
        <div class="guide-actions">
          <button id="guide-back">Back</button>
          <button id="guide-next" class="primary">Next</button>
          <button
            id="guide-exit"
            class="icon"
            data-icon="x"
            title="Close the guide"
            aria-label="Close the guide"
          ></button>
        </div>
      </aside>
    </main>
    <footer>
      <div class="legend">
        <span><i class="red line"></i>Excitation</span
        ><span><i class="blue line"></i>Inhibition</span
        ><span id="detail-legend">Width: mean fitted share</span
        ><span id="hint" class="hint" aria-live="polite"></span
        ><span class="cohort">150 cells · 168 recordings</span>
      </div>
    </footer>
    <dialog id="methods">
      <div class="dialog-heading">
        <h2>About this atlas</h2>
        <button
          id="close-methods"
          class="icon"
          data-icon="x"
          title="Close"
          aria-label="Close"
        ></button>
      </div>
      <div id="methods-body"></div>
    </dialog>
    <div id="toast" role="status"></div>
    <script id="dataset" type="application/json">
      <!--DATA-->
    </script>
    <script id="icons" type="application/json">
      <!--ICONS-->
    </script>
    <script>
      <!--VENDOR-->
    </script>
    <script>
      <!--CORE-->
    </script>
    <script>
      <!--APP-->
    </script>
  </body>
</html>
